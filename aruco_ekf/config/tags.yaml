aruco_ekf:
  ros__parameters:
    # Publishing rate for filtered odometry (Hz)
    publish_rate: 50.0
    
    # Default tag size in meters (used if tag_sizes not specified per tag)
    tag_size: 0.16  # 16cm tags
    
    # Optional: Per-tag sizes if your tags have different sizes
    tag_sizes: {}
      # '0': 0.16  # 16cm
      # '1': 0.20  # 20cm
    
    # AprilTag positions in world frame (6-DOF)
    # Each tag has x, y, z (m) and roll, pitch, yaw (radians) in the world coordinate frame
    tag_positions:
      '0':
        x: 0.0
        y: 0.0
        z: 1.5      # Height above ground
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      '1':
        x: 2.0
        y: 0.0
        z: 1.5
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      '2':
        x: 2.0
        y: 2.0
        z: 1.5
        roll: 0.0
        pitch: 0.0
        yaw: 1.5708  # 90 degrees
      '3':
        x: 0.0
        y: 2.0
        z: 1.5
        roll: 0.0
        pitch: 0.0
        yaw: 1.5708  # 90 degrees
      '4':
        x: 4.0
        y: 0.0
        z: 1.5
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      '5':
        x: 4.0
        y: 2.0
        z: 1.5
        roll: 0.0
        pitch: 0.0
        yaw: 1.5708
      # Example: Tag on ceiling
      '6':
        x: 1.0
        y: 1.0
        z: 3.0
        roll: 3.1416   # 180 degrees (upside down)
        pitch: 0.0
        yaw: 0.0