ekf_filter_node:
  ros__parameters:
    frequency: 40.0
    two_d_mode: true          # Essential for ground vehicles (locks Z, Roll, Pitch to 0)
    publish_tf: true          # EKF publishes odom -> base_link
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # ---------------------------------------------------------
    # INPUT 1: Particle Filter (Absolute Location)
    # ---------------------------------------------------------
    pose0: /optitrack/pose_cov   # <--- Change this to the new output topic
    pose0_config: [true,  true,  false,  
                   false, false, true,   
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    
    # ---------------------------------------------------------
    # INPUT 2: Cleaned VESC IMU (Drift & Momentum)
    # ---------------------------------------------------------
    imu0: /sensors/imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,    # Yaw Velocity (Gyro Z)
                  true,  true,  false]   # X, Y Acceleration (Drift detection!)
    imu0_relative: true
    # imu0_linear_acceleration_rejection_threshold: 0.5

    # ---------------------------------------------------------
    # INPUT 3: ZUPT (Anti-Phantom Drift)
    # ---------------------------------------------------------
    twist0: /zupt
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,  # Locks Vx, Vy to 0 when parked
                    false, false, true,   # Locks Vyaw to 0 when parked
                    false, false, false]